name: Préparer la branche Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests statiques
        run: python -m unittest tests.test_site -v
      - name: Construire le site
        run: |
          python scripts/build.py
          test -f dist/index.html
          test -f dist/.htaccess
      - name: Journal de build
        run: |
          # Consultable en ligne sur /build-info.txt pour vérifier ce que Hostinger sert.
          {
            echo "Commit source : ${GITHUB_SHA}"
            echo "Branche       : ${GITHUB_REF_NAME}"
            echo "Construit le  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Run Actions   : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Fichiers :"
            (cd dist && find . -type f ! -name build-info.txt | sort)
          } > dist/build-info.txt
          cat dist/build-info.txt
          { echo '## Site construit pour Hostinger'; echo '```'; cat dist/build-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier dist/ sur la branche hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Site construit depuis ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
